<style>
     .container {

    .links-container {

    .link-card {
        display: flex;
        align-items: center;

        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
        transition: all 0.3s ease;
        border: 1px solid transparent;
    }

    .link-card i {
        font-size: 1.4rem;
        width: 30px;
        margin-right: 12px;
    }

    .link-card span {
        flex-grow: 1;
        text-align: center;
        margin-right: 30px; /* Aligne le texte au centre en compensant l'icône */
    }

    /* Effets au survol */
    .link-card:hover {
        transform: translateY(-3px);
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    /* Couleurs personnalisées au survol */
    .website:hover { border-color: #38bdf8; color: #38bdf8; }
    .github:hover { border-color: #2ea44f; color: #2ea44f; }
    .instagram:hover { border-color: #e1306c; color: #e1306c; }

    footer {

            /* ... tes styles précédents (ex: .container, .profile-img, etc.) ... */

        footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #64748b;
        }

        .link-card.website {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            overflow: hidden;
            z-index: 1;
            border: none !important;
            transition: transform 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8), 0 0 5px #000000;
        }

        .link-card.website i,
        .link-card.website span {
            color: #000000 !important;
        }

        .link-card.website::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                #000000, 
                #ffffff, 
                #000000, 
                #333333, 
                #000000
            );
            z-index: -2;
            animation: rotate-border 3s linear infinite;
        }

        .link-card.website::after {
            content: '';
            position: absolute;
            inset: 3px;
            background: #e8d8b7 !important;
            border-radius: 11px;
            z-index: -1;
        }

        @keyframes rotate-border {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
